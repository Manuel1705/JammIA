[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.19.0",
    "gtts>=2.5.4",
    "langchain-core>=1.4.8",
    "langchain-neo4j>=0.10.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mlx-lm>=0.21.0",
    "numpy>=2.5.0",
    "sounddevice>=0.5.5",
    "sparqlwrapper>=2.0.0",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
